name: benchmarks

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-mise
      - name: Build benchmarks
        run: mise run bench-codspeed-build
      # anything in codspeed action runs in simulation mode, so build must go outside
      - name: Run benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          run: mise run bench-codspeed-run
          mode: simulation
          token: ${{ secrets.CODSPEED_TOKEN }}
