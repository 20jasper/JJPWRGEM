name: release

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/release-targets.json
      - .github/workflows/release.yml
      - .github/workflows/host-npm.yml
      - .github/workflows/publish-npm.yml
      - scripts/release/**

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # an app token, so the release PR runs CI
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-mise
      - id: crates-io
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - id: sampo
        uses: bruits/sampo/crates/sampo-github-action@dc653d6ac85c45f139b0af898fb2dd1507f3fcd8 # v0.22.1
        with:
          command: auto
          cargo-token: ${{ steps.crates-io.outputs.token }}
          github-token: ${{ steps.app-token.outputs.token }}
          pr-title: Release
          # handle releases via script since sampo doesn't handle binary assets or turning off releases granularity
          create-github-release: false
        env:
          HK: "0"
      # last, since it switches to the release branch
      - if: steps.sampo.outputs.released == 'true'
        run: |
          git fetch origin release/main
          git switch release/main
          mise run package-json
          git add npm-packages/jjpwrgem
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Sync npm package version"
          git push origin release/main
        env:
          HK: "0"

  # whether the cli and lsp tags still lack a published GitHub release, and the cli its npm package
  plan:
    needs: release
    if: always() && contains(fromJSON('["success", "skipped"]'), needs.release.result)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      tag: ${{ steps.plan.outputs.tag }}
      cli: ${{ steps.plan.outputs.cli }}
      lsp_tag: ${{ steps.plan.outputs.lsp_tag }}
      lsp: ${{ steps.plan.outputs.lsp }}
      npm: ${{ steps.plan.outputs.npm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        run: ./scripts/release/plan.sh
        env:
          GH_TOKEN: ${{ github.token }}

  # pull requests build and package, but never publish
  build:
    needs: plan
    if: always() && needs.plan.result == 'success' && (needs.plan.outputs.cli == 'true' || github.event_name == 'pull_request')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TARGET: ${{ matrix.target }}
      GITHUB_TOKEN: ${{ github.token }}
      MISE_LOCKED: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # no cache, so release binaries never build from restored state
      - run: |
          rustup toolchain install --no-self-update
          rustup target add "$TARGET"
      - if: matrix.glibc != ''
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install: false
          cache: false
      - run: ./scripts/release/build.sh
        env:
          GLIBC: ${{ matrix.glibc }}
      - run: ./scripts/release/package.sh "$TARGET"
      - if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/jjpwrgem-*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-jjpwrgem-cli-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  wasm:
    needs: plan
    if: always() && needs.plan.result == 'success' && (needs.plan.outputs.lsp == 'true' || github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # no cache, so release builds never build from restored state
      - run: rustup toolchain install --no-self-update
      - uses: ./.github/actions/setup-mise
      - run: mise run build-wasm
      - run: |
          ./scripts/release/archive.sh "jjpwrgem-lsp-wasm-${LSP_TAG#jjpwrgem-lsp-v}.tar.gz" \
            LICENSE crates/lsp/readme.md crates/lsp/CHANGELOG.md target/wasm/jjpwrgem_lsp*
        env:
          LSP_TAG: ${{ needs.plan.outputs.lsp_tag }}
      - if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/jjpwrgem-*
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-jjpwrgem-lsp
          path: out/jjpwrgem-lsp-wasm-*
          if-no-files-found: error

  # after every build that was needed, since a release takes its assets once
  releases:
    needs: [release, plan, build, wasm]
    if: >-
      always() && github.event_name == 'push' && needs.release.result == 'success'
      && needs.plan.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.build.result)
      && contains(fromJSON('["success", "skipped"]'), needs.wasm.result)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.plan.outputs.cli == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-jjpwrgem-cli-*
          path: assets/jjpwrgem
          merge-multiple: true
      - if: needs.plan.outputs.lsp == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-jjpwrgem-lsp
          path: assets/jjpwrgem-lsp
      - run: ./scripts/release/releases.sh assets
        env:
          GH_TOKEN: ${{ github.token }}

  # after the cli release, since the npm package downloads its binaries
  host-npm:
    needs: [plan, releases]
    if: >-
      always() && github.event_name == 'push' && needs.plan.outputs.npm == 'true'
      && needs.releases.result == 'success'
    uses: ./.github/workflows/host-npm.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
    permissions:
      contents: read

  publish-npm:
    needs: [plan, host-npm]
    uses: ./.github/workflows/publish-npm.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    permissions:
      id-token: write
