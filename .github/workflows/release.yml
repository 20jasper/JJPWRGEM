name: release

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/release-targets.json
      - .github/workflows/release.yml
      - .github/workflows/host-npm.yml
      - .github/workflows/publish-npm.yml
      - scripts/release/**

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      # a PAT, so the release PR runs CI
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-mise
      - id: crates-io
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - id: sampo
        uses: bruits/sampo/crates/sampo-github-action@01b484549021f6f458c5aa93820d4a63a39d9485 # v0.22.0
        with:
          command: auto
          cargo-token: ${{ steps.crates-io.outputs.token }}
          github-token: ${{ secrets.RELEASE_PLZ_TOKEN }}
          pr-title: Release
          # handle releases via script since sampo doesn't handle binary assets or turning off releases granularity
          create-github-release: false
        env:
          HK: "0"
      - run: ./scripts/release/library-releases.sh
        env:
          GH_TOKEN: ${{ github.token }}
      # last, since it switches to the release branch
      - if: steps.sampo.outputs.released == 'true'
        run: |
          git fetch origin release/main
          git switch release/main
          mise run package-json
          git add npm-packages/jjpwrgem
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Sync npm package version"
          git push origin release/main
        env:
          HK: "0"

  # whether the cli's tagged version still lacks its GitHub release or npm package
  plan:
    needs: release
    if: always() && contains(fromJSON('["success", "skipped"]'), needs.release.result)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      tag: ${{ steps.plan.outputs.tag }}
      cli: ${{ steps.plan.outputs.cli }}
      npm: ${{ steps.plan.outputs.npm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        run: |
          echo "matrix=$(jq -c '{include: .}' .github/release-targets.json)" >>"$GITHUB_OUTPUT"
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "jjpwrgem") | .version')
          tag="jjpwrgem-v$version"
          cli=false
          npm=false
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            [ "$(gh release view "$tag" --json isDraft -q .isDraft 2>/dev/null || echo missing)" = false ] || cli=true
            [ -n "$(npm view "jjpwrgem@$version" version 2>/dev/null)" ] || npm=true
          fi
          { echo "tag=$tag"; echo "cli=$cli"; echo "npm=$npm"; } >>"$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  # pull requests build and package, but never publish
  build:
    needs: plan
    if: always() && needs.plan.result == 'success' && (needs.plan.outputs.cli == 'true' || github.event_name == 'pull_request')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # no cache, so release binaries never build from restored state
      - run: |
          rustup toolchain install --no-self-update
          rustup target add "$TARGET"
      - run: cargo build --locked --profile dist --bin jjp --target "$TARGET"
      - run: ./scripts/release/package.sh "$TARGET"
      - if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/jjpwrgem-*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  cli-release:
    needs: [plan, build]
    if: always() && github.event_name == 'push' && needs.plan.outputs.cli == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - run: ./scripts/release/cli-release.sh "$TAG" assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}

  # after the cli release, since the npm package downloads its binaries
  host-npm:
    needs: [plan, cli-release]
    if: >-
      always() && github.event_name == 'push' && needs.plan.outputs.npm == 'true'
      && (needs.plan.outputs.cli == 'false' || needs.cli-release.result == 'success')
    uses: ./.github/workflows/host-npm.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}

  publish-npm:
    needs: [plan, host-npm]
    uses: ./.github/workflows/publish-npm.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    permissions:
      id-token: write
