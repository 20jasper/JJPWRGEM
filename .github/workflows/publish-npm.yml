name: Publish npm

on:
  workflow_call:
    inputs:
      plan:
        description: Dist release plan JSON payload
        required: true
        type: string
      tag:
        description: Release tag, defaults to the triggering tag
        required: false
        type: string
        default: ""
      dry_run:
        description: Pass --dry-run to npm publish
        required: false
        type: boolean
        default: false

permissions:
  contents: none
  id-token: write

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    env:
      PLAN: ${{ inputs.plan }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      - run: npm i -g npm@latest
      - name: Download npm package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.tag || github.ref_name }}-npm-package.tgz
          path: ./npm
      - name: Publish npm package
        working-directory: npm
        run: |
          set -euo pipefail
          tarball=$(find . -maxdepth 1 -name '*.tgz' -print | head -n1 || true)
          if [ -z "${tarball}" ]; then
            echo "No tarball (*.tgz) found in $(pwd)"
            ls -la
            exit 1
          fi
          name=$(tar -xzOf "${tarball}" package/package.json | jq -r .name)
          version=$(tar -xzOf "${tarball}" package/package.json | jq -r .version)
          if [ -n "$(npm view "${name}@${version}" version 2>/dev/null)" ]; then
            echo "${name}@${version} is already on npm, nothing to publish" >&2
            exit 1
          fi
          echo "Publishing ${tarball}"
          IS_PRERELEASE=$(echo "$PLAN" | jq -r '.announcement_is_prerelease')
          args=(--access public --provenance)
          if [ "$IS_PRERELEASE" = "true" ]; then
            args+=(--tag alpha)
          fi
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          npm publish "${args[@]}" "${tarball}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
