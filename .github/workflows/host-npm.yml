name: Host npm

on:
  workflow_call:
    inputs:
      plan:
        description: Dist release plan JSON payload
        required: true
        type: string

permissions:
  contents: read

jobs:
  host:
    name: host npm
    runs-on: ubuntu-latest
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Copy readme and changelog
        run: |
          cp -f readme.md npm-template/README.md
          cp -f CHANGELOG.md npm-template/CHANGELOG.md

      - name: Pack npm
        run: |
          mkdir -p ./npm
          npm pack ./npm-packages/jjpwrgem --pack-destination ./npm

      - name: Upload npm package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.ref_name }}-npm-package.tgz
          path: ./npm/*.tgz
