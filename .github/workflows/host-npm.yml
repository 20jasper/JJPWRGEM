name: Host npm

on:
  workflow_call:
    inputs:
      plan:
        description: Dist release plan JSON payload
        required: true
        type: string
      tag:
        description: Release tag, defaults to the triggering tag
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  host:
    name: host npm
    runs-on: ubuntu-latest
    env:
      PLAN: ${{ inputs.plan }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # script from the triggering ref so replays of old tags use the current one
      - name: Checkout packing script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci
          persist-credentials: false

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: src
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Pack npm
        working-directory: src
        run: ../ci/scripts/pack-npm.sh

      - name: Check tarball version matches tag
        working-directory: src/npm
        run: |
          set -euo pipefail
          packed=$(tar -xzOf ./*.tgz package/package.json | jq -r .version)
          expected="${TAG#jjpwrgem-v}"
          if [ "$packed" != "$expected" ]; then
            echo "tarball is version $packed but tag $TAG expects $expected" >&2
            exit 1
          fi

      - name: Upload npm package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.tag || github.ref_name }}-npm-package.tgz
          path: ./src/npm/*.tgz
