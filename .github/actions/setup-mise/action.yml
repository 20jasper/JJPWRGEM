name: mise setup
description: Install and cache mise tools

runs:
  using: composite
  steps:
    - name: Require the lockfile
      shell: bash
      # CI resolves tools only from mise.lock, so it never looks up releases
      # (and hits rate limits) or rewrites the lockfile.
      run: echo "MISE_LOCKED=1" >> "$GITHUB_ENV"
    - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
      with:
        tool: cargo-binstall
    - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      with:
        # later steps (hk, mise run) install tools from GitHub and need this to avoid rate limits
        persist_github_token: true
      env:
        GITHUB_TOKEN: ${{ github.token }}
