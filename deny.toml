[licenses]
allow = ["Apache-2.0", "MIT", "MIT-0", "Unicode-3.0"]
confidence-threshold = 0.8

[advisories]
ignore = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
# https://github.com/tokio-rs/tracing/pull/3594
# https://github.com/la10736/rstest/pull/350
skip = [
  { crate = "syn@2", reason = "tracing-attributes and rstest have not released syn 3 support" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
