[package]
name = "benches"
version = "0.0.0"
edition.workspace = true
publish = false
include = []

[dependencies]

[dev-dependencies]
bytes2chars = { path = "../crates/bytes2chars" }
criterion = { package = "codspeed-criterion-compat", version = "=6.0.0" }
gungraun = "=0.20.0"
jjpwrgem-parse = { path = "../crates/parse", features = ["serde"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
simd-json = "=0.19.0"
sonic-rs = "=0.5.10"
utf8-decode = "=2.0.0"
bstr = "=1.13.1"

[[bench]]
name = "bytes2chars"
harness = false

[[bench]]
name = "json_deser"
harness = false

[[bench]]
name = "json_prettify"
harness = false

[[bench]]
name = "json_uglify"
harness = false

[[bench]]
name = "json_serialize"
harness = false

[[bench]]
name = "json_iai"
harness = false

[[bench]]
name = "json_tokens"
harness = false

[[bench]]
name = "json_jsonlines"
harness = false

