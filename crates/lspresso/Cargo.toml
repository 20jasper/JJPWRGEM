[package]
name = "lspresso"
description = "lsp testing and benchmarking"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
include = ["src/**/*"]

[lib]
doctest = false

[features]
test-binaries = []

[[bin]]
name = "lspresso_scripted_server"
required-features = ["test-binaries"]

[dependencies]
crossbeam-channel = "0.5.17"
displaydoc = { workspace = true }
gen-lsp-types = { git = "https://github.com/ribru17/gen-lsp-types", branch = "main", features = [
  "fluent-uri",
] }
lsp-server = "0.10.0"
serde = { workspace = true }
serde_json = { workspace = true }
sysinfo = "0.40"
thiserror = "2.0.21"

[lints]
workspace = true
