[package]
name = "lspresso"
description = "lsp testing and benchmarking"
version = "0.2.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
include = ["src/**/*", "README.md", "lspresso.webp"]
rust-version = "1.95"

[features]
test-binaries = []

[[bin]]
name = "lspresso_scripted_server"
required-features = ["test-binaries"]

[dependencies]
crossbeam-channel = "0.5.17"
displaydoc = { workspace = true }
gen-lsp-types = { version = "0.11.0", features = ["fluent-uri"] }
lsp-server = "0.10.0"
pastey = "0.2.3"
serde = { workspace = true }
serde_json = { workspace = true }
sysinfo = "0.40"
thiserror = "2.0.21"

[dev-dependencies]
criterion = { workspace = true }

[lints]
workspace = true

