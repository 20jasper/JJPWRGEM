[package]
name = "jjpwrgem-lsp"
version = "0.1.6"
edition.workspace = true
authors.workspace = true
description = "JSON language server with rich errors"
license.workspace = true
readme = "readme.md"
repository.workspace = true
documentation = "https://docs.rs/jjpwrgem-lsp"
keywords = ["json", "lsp", "parser", "formatter", "diagnostics"]
categories = ["development-tools", "parser-implementations", "text-processing"]
include = ["src/**/*", "readme.md", "THIRD_PARTY.md"]

[dev-dependencies]
rstest = { workspace = true }

[dependencies]
gen-lsp-types = { version = "0.11.0", features = ["fluent-uri"] }
itertools = { workspace = true }
jjpwrgem-parse = { workspace = true, features = ["serde"] }
line-index = "0.1.2"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }

[lints]
workspace = true

[lib]
doctest = false

