min_version = "2026.11.1"

[settings]
experimental = true
lockfile = true
disable_backends = ["asdf"] # doesn't play nice with lockfiles
idiomatic_version_file_enable_tools = ["node"]

[settings.cargo]
binstall = true

[tools]
"packslip:github.com/jdx/hk" = "2.10.0"
jq = "1.8.2"
"aqua:pnpm/pnpm" = "12.17.0"

[hooks]
postinstall = "hk install --mise"
