[tasks.readmes]
description = "Generate markdown files from templates"
sources = [
  "xtask/templates/**",
  "xtask/src/template.rs",
  "benches/docker/output/*.md",
  "benches/output/*.md",
]
outputs = [
  "readme.md",
  "crates/parse/readme.md",
  "crates/json-schema/README.md",
  "benches/BENCHMARKS.md",
  "benches/json.md",
  "benches/cli-formatter.md",
  "benches/utf8.md",
  "npm-packages/jjpwrgem-vscode/README.md",
  "crates/lsp/readme.md",
  "crates/bytes2chars/README.md",
  "crates/lspresso/README.md",
]
run = [
  "cargo xtask generate-readmes",
  "cargo +nightly fmt -p bytes2chars",
  "cargo rdme --workspace-project bytes2chars --force",
  "cargo rdme --workspace-project lspresso --force",
]

[tasks.readmes.tools]
"github:orium/cargo-rdme" = "2.2"
"github:bearcove/tracey" = "1.3.0"
"npm:oxfmt" = "0.75.0"

[tasks."readmes-check"]
description = "Verify markdown files match generated templates"
run = [
  "cargo xtask verify-readmes",
  "cargo rdme --workspace-project bytes2chars --check",
  "cargo rdme --workspace-project lspresso --check",
]

[tasks."readmes-check".tools]
"github:orium/cargo-rdme" = "2.2"
"github:bearcove/tracey" = "1.3.0"
"npm:oxfmt" = "0.75.0"
