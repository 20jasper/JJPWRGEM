[tasks.changeset]
description = "Describe a change for the next release"
run = "sampo add"

[tasks.changeset.tools]
"github:bruits/sampo" = { version = "0.24.0", version_prefix = "cargo-sampo-v" }

[tasks.release-plan]
description = "Print the versions pending changesets would release"
env = { SAMPO_RELEASE_BRANCH = "main" }
run = "sampo release --dry-run"

[tasks.release-plan.tools]
"github:bruits/sampo" = { version = "0.24.0", version_prefix = "cargo-sampo-v" }

[tasks.semver-check]
description = "Check every library crate's API against its last published version"
run = "cargo semver-checks check-release --workspace"

[tasks.semver-check.tools]
"cargo:cargo-semver-checks" = "0.51.0"

[tasks.zigbuild]
description = "Build the release binary for $TARGET against glibc $GLIBC"
run = 'cargo zigbuild --locked --profile dist --bin jjp --target "$TARGET.$GLIBC"'

[tasks.zigbuild.tools]
zig = "0.17.1"
"github:rust-cross/cargo-zigbuild" = "0.24.1"
