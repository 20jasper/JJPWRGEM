[vars]
codspeed_benches = "--bench bytes2chars --bench json_deser --bench json_prettify --bench json_uglify --bench json_serialize --bench json_tokens --bench lsp"

[tasks.bench]
dir = "{{config_root}}/benches"
shell = "bash -c"
usage = '''
arg "<name>" help="Bench target name (e.g. bytes2chars, json_deser, json_prettify, json_uglify, json_serialize, json_tokens)"
flag "--sample-size <n>" help="Pass through to criterion"
'''
run = '''
set -euo pipefail
mkdir -p output
cargo criterion --bench "$usage_name" --message-format=json \
  ${usage_sample_size:+--sample-size "$usage_sample_size"} \
  | cargo xtask bench-table > "output/$usage_name.md"
cargo xtask generate-readmes
cargo +nightly fmt -p bytes2chars
cargo rdme --workspace-project bytes2chars --force
'''

[tasks.bench.tools]
"cargo:cargo-criterion" = "1.1.0"
"cargo:cargo-rdme" = "2.2"
"cargo:tracey" = "1.3.0"
"npm:oxfmt" = "0.74.0"

[tasks.bench-json]
description = "Run the four standard json criterion benches and regenerate readmes"
run = [
  'mise run bench json_deser "$@"',
  'mise run bench json_prettify "$@"',
  'mise run bench json_uglify "$@"',
  'mise run bench json_serialize "$@"',
]

[tasks.bench-json.tools]
"cargo:cargo-criterion" = "1.1.0"
"cargo:cargo-rdme" = "2.2"
"cargo:tracey" = "1.3.0"
"npm:oxfmt" = "0.74.0"

[tasks.bench-codspeed]
description = "Build and run all criterion benches via codspeed"
dir = "{{config_root}}/benches"
run = [
  "cargo build --profile dist -p jjpwrgem",
  "cargo codspeed build {{vars.codspeed_benches}}",
  "cargo codspeed run {{vars.codspeed_benches}}",
]

[tasks.bench-codspeed.tools]
"cargo:cargo-codspeed" = "6.0.0"

[tasks.bench-iai]
description = "Run the iai (gungraun) bench"
dir = "{{config_root}}/benches"
run = 'cargo bench --bench json_iai "$@"'

[tasks.bench-iai.tools]
"cargo:gungraun-runner" = "0.20.0"

[tasks.plot-bench]
description = "Plot docker bench results"
run = "cargo xtask plot-benchmarks"

[tasks.kcachegrind]
description = "Open kcachegrind on a json_iai callgrind output (Linux only; requires kcachegrind on PATH)"
shell = "bash -c"
run = '''
bench=${1:-deser}
fixture=${2:-citm}
out="target/gungraun/benches/json_iai/${bench}_group/bench_${bench}.${fixture}/callgrind.bench_${bench}.${fixture}.out"
rustfilt < "$out" > "${out%.out}.demangled.out"
kcachegrind "${out%.out}.demangled.out" &
'''

[tasks.kcachegrind.tools]
"cargo:rustfilt" = "0.2.2"

[tasks.iai-annotate]
description = "callgrind_annotate a json_iai output, demangled by rustfilt (Linux only)"
shell = "bash -c"
run = '''
bench=${1:-deser}
fixture=${2:-citm}
callgrind_annotate \
  "target/gungraun/benches/json_iai/${bench}_group/bench_${bench}.${fixture}/callgrind.bench_${bench}.${fixture}.out" \
  2>/dev/null | rustfilt | head -60
'''

[tasks.iai-annotate.tools]
"cargo:rustfilt" = "0.2.2"

[tasks.bench-docker]
description = "Run perf tests against 10+ cli tools via docker and embed outputs in readmes"
shell = "bash -c"
run = '''
mkdir -p benches/docker/output
mise run -C benches/docker build-oci
docker buildx create --name jjp-bench --driver docker-container 2>/dev/null || true
GITHUB_TOKEN="$(gh auth token 2>/dev/null || true)" \
  docker buildx build --builder jjp-bench -t jjp-benchmark \
    --build-context "mise-tools=oci-layout://$(pwd)/benches/docker/.mise-oci" \
    --secret id=gh_token,env=GITHUB_TOKEN \
    --load .
docker run --rm \
  -u "$(id -u):$(id -g)" \
  -v "$(pwd)/benches/docker/output:/benchmark/output" \
  jjp-benchmark

oxfmt './benches/docker/output/*.md' --write
cargo xtask plot-benchmarks
cargo xtask generate-readmes
cargo rdme --workspace-project bytes2chars --force
'''

[tasks.bench-docker.tools]
"npm:oxfmt" = "0.74.0"
"cargo:cargo-rdme" = "2.2"
"cargo:tracey" = "1.3.0"

[tasks.bench-lsp]
description = "Bench jjp's LSP against other JSON LSPs via lspresso and regenerate benches/lsp/lsp.md"
dir = "{{config_root}}/benches"
shell = "bash -c"
run = '''
set -euo pipefail
cargo build --profile dist -p jjpwrgem
cargo criterion --bench lsp --message-format=json | cargo xtask lsp-bench-report
cargo xtask generate-readmes
'''

[tasks.bench-lsp.tools]
"cargo:cargo-criterion" = "1.1.0"
"npm:vscode-langservers-extracted" = "4.10.0"
"github:libkakashi/light-json-lsp" = "0.1.0"
"cargo:tracey" = "1.3.0"
"npm:oxfmt" = "0.74.0"
"cargo:cargo-rdme" = "2.2"

[tasks.test-lsp-e2e]
description = "Run the language server e2e properties against jjp and every comparison server"
env = { LSP_E2E_REQUIRE = "vscode-json,light-json-lsp" }
run = "cargo test --test integration lsp_e2e"

[tasks.test-lsp-e2e.tools]
"npm:vscode-langservers-extracted" = "4.10.0"
"github:libkakashi/light-json-lsp" = "0.1.0"
