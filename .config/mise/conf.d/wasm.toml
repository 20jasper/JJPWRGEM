[tasks.build-wasm]
description = "Build the language server to wasm into target/wasm"
env = { CARGO_PROFILE_DIST_STRIP = "false" }
run = [
  # wasm simd128 is supported by Chrome, Firefox and Node since 2021 and Safari since 2023
  "RUSTFLAGS=\"${RUSTFLAGS:-} -C target-feature=+simd128\" cargo rustc -p jjpwrgem-lsp --profile dist --target wasm32-unknown-unknown --features wasm --crate-type cdylib",
  "wasm-bindgen --target web --out-dir target/wasm --out-name jjpwrgem_lsp target/wasm32-unknown-unknown/dist/jjpwrgem_lsp.wasm",
  "wasm-opt -Os --enable-simd -o target/wasm/jjpwrgem_lsp_bg.wasm target/wasm/jjpwrgem_lsp_bg.wasm",
]

[tasks.build-wasm.tools]
"cargo:wasm-bindgen-cli" = "0.2.130"
"aqua:WebAssembly/binaryen" = "version_133"

[tasks.test-wasm]
description = "Run the wasm smoke test in Node"
env = { CARGO_PROFILE_DIST_STRIP = "false", CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER = "wasm-bindgen-test-runner" }
run = "RUSTFLAGS=\"${RUSTFLAGS:-} -C target-feature=+simd128\" cargo test -p jjpwrgem-lsp --target wasm32-unknown-unknown --features wasm --profile dist --test wasm"

[tasks.test-wasm.tools]
"cargo:wasm-bindgen-cli" = "0.2.130"
