[tasks.build-wasm]
description = "Build the language server to wasm into target/wasm"
env = { CARGO_PROFILE_DIST_STRIP = "false" }
run = [
  "cargo build -p jjpwrgem-lsp-wasm --profile dist --target wasm32-unknown-unknown",
  "wasm-bindgen --target web --out-dir target/wasm --out-name jjpwrgem_lsp target/wasm32-unknown-unknown/dist/jjpwrgem_lsp_wasm.wasm",
  "wasm-opt -Os --enable-simd -o target/wasm/jjpwrgem_lsp_bg.wasm target/wasm/jjpwrgem_lsp_bg.wasm",
]

[tasks.build-wasm.tools]
"cargo:wasm-bindgen-cli" = "0.2.130"
"aqua:WebAssembly/binaryen" = "version_133"
