[tasks.package-json]
description = "Regenerate package.json and shrinkwrap"
sources = ["xtask/src/**/*.rs", "Cargo.toml", ".github/release-targets.json"]
outputs = [
  "npm-packages/jjpwrgem/package.json",
  "npm-packages/jjpwrgem/npm-shrinkwrap.json",
]
run = [
  "cargo xtask npm-package",
  "npm install --prefix npm-packages/jjpwrgem --ignore-scripts --no-fund",
  "npm shrinkwrap --prefix npm-packages/jjpwrgem",
]

[tasks.package-json.tools]
"npm:oxfmt" = "0.79.0"

[tasks.pack-npm]
description = "Pack the npm package into ./npm and verify README, CHANGELOG and LICENSE are included"
run = "./scripts/pack-npm.sh"
