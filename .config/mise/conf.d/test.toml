[tools]
"aqua:mitsuhiko/insta" = "1.49"

[vars]
test_flags = "--all-features --workspace -q"

[tasks.test]
description = "Run tests excluding benchmarks, prettier conformance, and slow property tests"
run = [
  'cargo test {{vars.test_flags}} --tests --lib --bins --examples "$@" -- --skip prop_ --skip matches_prettier --skip prettier_conformance > {{get_env(name="TEST_OUTPUT", default="/dev/null")}}',
  "echo 'tests passed!'",
]

[tasks.test.tools]
"aqua:mitsuhiko/insta" = "1.49"

[tasks.test-all]
description = "Run full test suite including snapshots and large prettier props"
depends_post = ["test-snapshot", "test-prettier-large"]
run = [
  'cargo test {{vars.test_flags}} --tests --lib --bins --examples "$@" -- --skip matches_prettier > /dev/null',
  "echo 'tests passed!'",
]

[tasks.test-all.tools]
"aqua:mitsuhiko/insta" = "1.49"
"npm:prettier" = "3.10.1"

[tasks.test-prettier-prop]
description = "Run all prettier property tests with full case count (slow)"
env = { PROPTEST_CASES = "256" }
run = "cargo test --test integration {{vars.test_flags}} -- prop_"

[tasks.test-prettier-prop.tools]
"npm:prettier" = "3.10.1"

[tasks.test-prettier-large]
description = "Run slow prettier property tests on large objects"
env = { PROPTEST_CASES = "256" }
run = "cargo test --test integration {{vars.test_flags}} -- --include-ignored prop_large_object_expanded"

[tasks.test-prettier-large.tools]
"npm:prettier" = "3.10.1"

[tasks.test-cov]
description = "Compute and write line-coverage percentage to benches/output/coverage.txt"
run = '''cargo llvm-cov --exclude xtask {{vars.test_flags}} --json --summary-only "$@" \
  -- --skip prop_ --skip matches_prettier \
  | jq -r '(.data[0].totals.lines.percent * 10 | round) / 10' > benches/output/coverage.txt'''

[tasks.test-cov.tools]
"aqua:taiki-e/cargo-llvm-cov" = "0.9"
"aqua:mitsuhiko/insta" = "1.49"

[tasks.test-snapshot]
description = "Run insta snapshot tests (needs submodules, see mise run submodules); deletes unreferenced snapshots locally and rejects in CI"
run = [
  'test -d tests/conformance/JSONTestSuite/test_parsing && test -f tests/conformance/utf8tests/utf8tests.txt || { echo "submodules are missing, run mise run submodules" >&2; exit 1; }',
  "cargo insta test --unreferenced auto --all-features --workspace",
  "cargo insta review",
]

[tasks.test-snapshot.tools]
"aqua:mitsuhiko/insta" = "1.49"

[tasks.test-vscode-linux]
run = "xvfb-run -a pnpm --filter jjpwrgem-vscode test"
